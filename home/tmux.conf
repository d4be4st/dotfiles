# ── terminal ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"           # true color
set -ga terminal-overrides ",*:RGB"
set -ga terminal-overrides "*:Ms=\\E]52;%p1%s;%p2%s\\007" # clipboard
set -g allow-passthrough on                  # pass OSC 133 marks through to Ghostty
set -g extended-keys on                      # pass Kitty keyboard protocol through (enables Ctrl+Enter in Claude)

# ── core ───────────────────────────────────────────────────────────────────────
set -g default-shell $SHELL
set -g history-limit 50000
set -sg escape-time 0
set -g display-time 2000
set -g remain-on-exit off
set -g repeat-time 300
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S · #W"
set-option -g status-position top
setw -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

# ── prefix ─────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# ── windows & panes ────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind = select-layout tiled
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── navigation (vim-tmux-navigator inline) ─────────────────────────────────────
# Ctrl+h/j/k/l moves between tmux panes AND nvim splits seamlessly
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-l' select-pane -R

# window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# ── session management ─────────────────────────────────────────────────────────
bind N new-session
# s = task picker via w open (fzf over active tasks)
bind s choose-session
bind S display-popup -E "#{HOME}/dev/productive/work/scripts/w-popup"
# pick a resurrect restore point (instead of always restoring `last`)
bind R display-popup -E -w 80% -h 70% "#{HOME}/.tmux/resurrect-pick.sh"

# ── copy mode ──────────────────────────────────────────────────────────────────
set -g set-clipboard on
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi L   send -X end-of-line
bind -T copy-mode-vi H   send -X start-of-line
bind p   paste-buffer
bind C-p choose-buffer

# clear screen
bind C-l send-keys C-l \; send-keys -R \; clear-history

# ── plugins ────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ── theme ──────────────────────────────────────────────────────────────────────
source-file "~/.tmux/theme.tmux"

run '~/.tmux/plugins/tpm/tpm'

# continuum auto-save: armed manually because continuum's self-arming guard
# trips on overmind's embedded tmux servers and silently disables saving.
# Scoped to the default socket so only the main server ever writes saves.
%if "#{m:*/default,#{socket_path}}"
# Seed the save timestamp to now so the first auto-save waits a full interval
# after boot — lets auto-restore repopulate first, so an empty bootstrap state
# never clobbers `last`. (continuum skips its own seeding here because overmind's
# embedded servers trip its another_tmux_server_running guard.)
run-shell "tmux set -g @continuum-save-last-timestamp $(date +%s)"
set -ag status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
%endif

# On killing the attached session (e.g. `workspaces close`), switch the client to
# another surviving session instead of detaching — keeps the Ghostty window alive.
set -g detach-on-destroy off
